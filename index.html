<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aventura na Montanha</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#514677,#171723 78%);color:white;font-family:Arial,sans-serif}.app{width:min(100%,900px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:bold}.title{font-size:20px}.wallet{padding:8px 14px;border-radius:20px;color:#302416;background:#ffd85b}.frame{position:relative;overflow:hidden;border:1px solid #ffffff44;border-radius:22px;background:#26263c;box-shadow:0 20px 60px #0008}canvas{display:block;width:100%;height:auto}.hud{position:absolute;inset:13px 14px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.score,.cp{padding:8px 12px;border:1px solid #ffffff44;border-radius:12px;background:#191927cc;font-size:13px}.cp{margin-top:6px;color:#bdf7dc}.actions{display:flex;gap:8px;pointer-events:auto}.control{border:1px solid #ffffff55;border-radius:12px;padding:9px 12px;color:white;background:#191927dd;font-size:15px;cursor:pointer}.layer{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:#11111dcc}.layer.hide{display:none}.panel{width:min(94%,440px);max-height:90%;overflow:auto;padding:24px;border:1px solid #ffffff55;border-radius:20px;background:linear-gradient(145deg,#37364d,#222231);text-align:center;box-shadow:0 15px 45px #0008}.panel h1{margin:0 0 9px;font-size:29px}.panel p{color:#d2d0df;line-height:1.5}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{padding:11px 18px;border:0;border-radius:12px;color:#272333;background:#ffd85b;font-weight:bold;cursor:pointer}.btn.alt{color:white;background:#59586e}.btn:disabled{opacity:.7}.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.item{padding:12px 8px;border:1px solid #ffffff33;border-radius:14px;background:#ffffff0c}.item p{margin:5px 0 10px;font-size:13px}.foot{text-align:center;color:#c7c4d5;font-size:13px}@media(max-width:560px){body{padding:8px}.title{font-size:15px}.score,.cp{padding:6px 8px;font-size:11px}.panel{padding:17px}.panel h1{font-size:23px}}
</style>
</head>
<body><main class="app"><div class="top"><span class="title">⛰️ AVENTURA NA MONTANHA</span><span class="wallet">🪙 <span id="wallet">0</span></span></div><section class="frame"><canvas id="game" width="900" height="500"></canvas><div class="hud"><div><div class="score">Distância: <b id="distance">0</b> m</div><div class="cp" id="cp">Checkpoint: início</div></div><div class="actions"><button class="control" id="exit">⏹ Sair</button><button class="control" id="settings">⚙️</button></div></div><div class="layer" id="layer"><div class="panel" id="panel"></div></div></section><p class="foot">Pule com Espaço, ↑ ou toque. Pegue moedas e alcance checkpoints!</p></main>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),layer=document.getElementById("layer"),panel=document.getElementById("panel");
const W=canvas.width,H=canvas.height,HX=155;
const outfits=[{id:"black",name:"Ninja urbano",price:0,hoodie:"#17181d",pants:"#202126",shoes:"#101115"},{id:"red",name:"Vermelho",price:8,hoodie:"#c94755",pants:"#292633",shoes:"#e1bd82"},{id:"blue",name:"Azul elétrico",price:15,hoodie:"#427bc2",pants:"#202b45",shoes:"#d8d9e2"},{id:"green",name:"Explorador",price:25,hoodie:"#4e966d",pants:"#343a2c",shoes:"#d2b77b"}];
let saved={};try{saved=JSON.parse(localStorage.getItem("mountainGame")||"{}")||{}}catch{}
let coins=saved.coins||0,owned=saved.owned||["black"],wearing=saved.wearing||"black",checkpoint=saved.checkpoint||0;
let state="menu",distance=checkpoint,nextCP=(Math.floor(checkpoint/1000)+1)*1000,nextSpawn=checkpoint+450,speed=4.5,time=0,last=0,jumpH=0,jumpV=0,run=0,rocks=[],pickups=[],notice="",noticeUntil=0;
function persist(){try{localStorage.setItem("mountainGame",JSON.stringify({coins:coins,owned:owned,wearing:wearing,checkpoint:checkpoint}))}catch{}updateHUD()}
function updateHUD(){document.getElementById("wallet").textContent=coins;document.getElementById("distance").textContent=Math.floor(distance);document.getElementById("cp").textContent=checkpoint?"Checkpoint: "+checkpoint+" m":"Checkpoint: início"}
function suit(){return outfits.find(x=>x.id===wearing)||outfits[0]}
function show(html){panel.innerHTML=html;layer.classList.remove("hide")}
function hide(){layer.classList.add("hide")}
function mainMenu(){state="menu";show('<div style="font-size:48px">🥷</div><h1>Aventura na Montanha</h1><p>Suba, pule as pedras e junte moedas!</p><p>Moedas: 🪙 <b>'+coins+'</b></p><div class="buttons"><button class="btn" data-act="play">▶ PLAY</button><button class="btn alt" data-act="shop">👕 Loja de roupas</button></div>')}
function openShop(){state="shop";let html=outfits.map(o=>{let has=owned.includes(o.id),on=wearing===o.id,text=on?"Em uso":has?"Equipar":"Comprar · "+o.price+" 🪙";return '<div class="item"><div style="font-size:30px">🥷</div><p><b>'+o.name+'</b></p><button class="btn" data-outfit="'+o.id+'" '+(on?"disabled":"")+'>'+text+'</button></div>'}).join("");show('<h1>Loja de roupas</h1><p>Moedas: 🪙 <b>'+coins+'</b></p><div class="shop">'+html+'</div><div class="buttons"><button class="btn alt" data-act="menu">Voltar ao menu</button></div>')}
function settingsMenu(){if(state==="jogando")state="paused";let canContinue=state==="paused";show('<div style="font-size:36px">⚙️</div><h1>Configurações</h1><p>Para pular, use Espaço, ↑ ou toque na tela.</p><div class="buttons">'+(canContinue?'<button class="btn" data-act="continue">Continuar</button>':'')+'<button class="btn alt" data-act="shop">👕 Loja</button><button class="btn alt" data-act="menu">Voltar ao menu</button></div>')}
function gameOver(){state="dead";show('<div style="font-size:42px">💥</div><h1>Você caiu!</h1><p>Distância: <b>'+Math.floor(distance)+' m</b></p><p>Checkpoint salvo: <b>'+checkpoint+' m</b></p><div class="buttons"><button class="btn" data-act="respawn">↻ Voltar ao checkpoint</button><button class="btn alt" data-act="menu">Menu</button></div>')}
function start(from){distance=from;jumpH=0;jumpV=0;speed=4.5;time=0;rocks=[];pickups=[];nextSpawn=distance+450;nextCP=(Math.floor(distance/1000)+1)*1000;state="jogando";hide();last=performance.now();requestAnimationFrame(loop)}
panel.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act,id=b.dataset.outfit;if(a==="play"||a==="respawn")start(checkpoint);if(a==="menu")mainMenu();if(a==="shop")openShop();if(a==="continue"){state="jogando";hide();last=performance.now();requestAnimationFrame(loop)}if(id){let o=outfits.find(x=>x.id===id);if(owned.includes(id))wearing=id;else if(o&&coins>=o.price){coins-=o.price;owned.push(id);wearing=id}persist();openShop()}});
document.getElementById("exit").addEventListener("click",mainMenu);
document.getElementById("settings").addEventListener("click",settingsMenu);
function ground(wx){return 405-Math.max(0,Math.sin(wx*.0022))*85}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#292e58");g.addColorStop(.6,"#80628c");g.addColorStop(1,"#e49b77");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff0b6";ctx.beginPath();ctx.arc(740,82,34,0,Math.PI*2);ctx.fill();for(let i=0;i<22;i++){ctx.fillStyle="#ffffffaa";ctx.beginPath();ctx.arc((i*131+40)%W,(i*47+22)%210,i%4===0?2.4:1.3,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#464970";ctx.beginPath();ctx.moveTo(0,315);for(let x=0;x<=W;x+=70)ctx.lineTo(x,290+Math.sin(x*.018)*50);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8)ctx.lineTo(x,ground(distance+x-HX));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle="#477a58";ctx.fill();ctx.beginPath();for(let x=0;x<=W;x+=8){let y=ground(distance+x-HX);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle="#8ed286";ctx.lineWidth=9;ctx.stroke()}
function drawHero(){let r=suit(),x=HX,foot=ground(distance)-jumpH,swing=state==="jogando"&&jumpH===0?Math.sin(run)*8:0;ctx.fillStyle="#17172266";ctx.beginPath();ctx.ellipse(x+28,ground(distance)+5,24,6,0,0,Math.PI*2);ctx.fill();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=r.pants;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(x+21,foot-43);ctx.lineTo(x+18+swing,foot-21);ctx.lineTo(x+14+swing,foot-8);ctx.moveTo(x+37,foot-43);ctx.lineTo(x+39-swing,foot-21);ctx.lineTo(x+46-swing,foot-8);ctx.stroke();ctx.strokeStyle=r.shoes;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+9+swing,foot-6);ctx.lineTo(x+24+swing,foot-6);ctx.moveTo(x+40-swing,foot-6);ctx.lineTo(x+54-swing,foot-6);ctx.stroke();ctx.fillStyle=r.hoodie;ctx.beginPath();ctx.roundRect(x+12,foot-91,38,51,12);ctx.fill();ctx.fillStyle="#101116";ctx.beginPath();ctx.ellipse(x+31,foot-111,29,34,-.1,0,Math.PI*2);ctx.fill();ctx.fillStyle="#d99a75";ctx.beginPath();ctx.ellipse(x+31,foot-111,18,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#090a0d";ctx.beginPath();ctx.roundRect(x+12,foot-119,38,23,10);ctx.fill();ctx.fillStyle="#f1e9da";ctx.beginPath();ctx.ellipse(x+23,foot-110,7,4.5,0,0,Math.PI*2);ctx.ellipse(x+39,foot-110,7,4.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#17171a";ctx.beginPath();ctx.arc(x+24,foot-110,2.7,0,Math.PI*2);ctx.arc(x+39,foot-110,2.7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#34353c";ctx.lineWidth=1.4;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+17+i*7,foot-126);ctx.lineTo(x+17+i*7,foot-119);ctx.stroke()}ctx.strokeStyle="#484951";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+19,foot-57);ctx.lineTo(x+43,foot-57);ctx.lineTo(x+40,foot-48);ctx.lineTo(x+22,foot-48);ctx.stroke();ctx.strokeStyle=r.hoodie;ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(x+15,foot-81);ctx.lineTo(x+7-swing*.4,foot-61);ctx.lineTo(x+12-swing*.4,foot-50);ctx.moveTo(x+47,foot-81);ctx.lineTo(x+55+swing*.4,foot-61);ctx.lineTo(x+49+swing*.4,foot-50);ctx.stroke();ctx.fillStyle="#d99a75";ctx.beginPath();ctx.arc(x+12-swing*.4,foot-49,5,0,Math.PI*2);ctx.arc(x+49+swing*.4,foot-49,5,0,Math.PI*2);ctx.fill()}
function drawHazard(o){let x=HX+o.wx-distance,y=ground(o.wx);if(o.type==="pedra"){ctx.save();ctx.translate(x,y-o.size/2);ctx.rotate((distance-o.wx)*.035);ctx.fillStyle="#777b87";ctx.beginPath();ctx.moveTo(-o.size*.55,o.size*.3);ctx.lineTo(-o.size*.38,-o.size*.3);ctx.lineTo(o.size*.18,-o.size*.52);ctx.lineTo(o.size*.52,-o.size*.1);ctx.lineTo(o.size*.45,o.size*.4);ctx.closePath();ctx.fill();ctx.restore()}else if(o.type==="caixa"){ctx.fillStyle="#a86148";ctx.fillRect(x-19,y-42,38,42);ctx.strokeStyle="#653c36";ctx.lineWidth=3;ctx.strokeRect(x-15,y-38,30,34);ctx.beginPath();ctx.moveTo(x-14,y-37);ctx.lineTo(x+14,y-5);ctx.moveTo(x+14,y-37);ctx.lineTo(x-14,y-5);ctx.stroke()}else{ctx.fillStyle="#f08a45";ctx.beginPath();ctx.moveTo(x,y-44);ctx.lineTo(x+21,y);ctx.lineTo(x-21,y);ctx.closePath();ctx.fill();ctx.fillStyle="#fff0d1";ctx.fillRect(x-12,y-17,24,6)}}
function drawCoin(c){let x=HX+c.wx-distance,y=ground(c.wx)-65-Math.sin(time*.12+c.wx)*4;ctx.fillStyle="#ffd54f";ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff0a1";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.stroke();ctx.fillStyle="#a76e23";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText("$",x,y+4)}
function draw(){drawBackground();rocks.forEach(drawHazard);pickups.filter(c=>!c.got).forEach(drawCoin);drawHero();if(notice&&performance.now()<noticeUntil){ctx.fillStyle="#fff3b0";ctx.font="bold 22px Arial";ctx.textAlign="center";ctx.fillText(notice,W/2,105)}}
function spawnAhead(){while(nextSpawn<distance+1100){let n=Math.random(),type=n<.65?"pedra":n<.82?"caixa":"cone";rocks.push({type,wx:nextSpawn,size:30+Math.random()*18});if(Math.random()<.9)pickups.push({wx:nextSpawn+100+Math.random()*70,got:false});nextSpawn+=360+Math.random()*260}}
function loop(now){if(state!=="jogando")return;let dt=Math.min((now-last)/16.67,2);last=now;time+=dt;distance+=speed*dt;speed=Math.min(8,speed+.0008*dt);run+=.2*dt;if(jumpH>0||jumpV>0){jumpH+=jumpV*dt;jumpV-=.7*dt;if(jumpH<=0&&jumpV<0){jumpH=0;jumpV=0}}spawnAhead();if(distance>=nextCP){checkpoint=Math.floor(distance/1000)*1000;nextCP=checkpoint+1000;notice="✨ CHECKPOINT!";noticeUntil=performance.now()+1800;persist()}let foot=ground(distance)-jumpH,top=foot-119;for(let o of rocks){let x=HX+o.wx-distance,w=o.type==="pedra"?o.size:42,h=o.type==="pedra"?o.size:44,y=ground(o.wx);if(x+w/2>HX+8&&x-w/2<HX+52&&top<y&&foot>y-h+4){draw();gameOver();return}}for(let c of pickups){let cy=ground(c.wx)-65;if(!c.got&&Math.abs(c.wx-distance)<42&&cy>=top&&cy<=foot){c.got=true;coins++;persist();notice="+1 moeda 🪙";noticeUntil=performance.now()+700}}rocks=rocks.filter(o=>o.wx>distance-100);pickups=pickups.filter(c=>!c.got&&c.wx>distance-100);updateHUD();draw();requestAnimationFrame(loop)}
function jump(){if(state==="jogando"&&jumpH===0)jumpV=15}
function gameOver(){state="dead";show('<div style="font-size:42px">💥</div><h1>Você caiu!</h1><p>Distância: <b>'+Math.floor(distance)+' m</b></p><p>Checkpoint salvo: <b>'+checkpoint+' m</b></p><div class="buttons"><button class="btn" data-act="respawn">↻ Voltar ao checkpoint</button><button class="btn alt" data-act="menu">Menu</button></div>')}
window.addEventListener("keydown",e=>{if(e.code==="Space"||e.key==="ArrowUp"){e.preventDefault();jump()}});canvas.addEventListener("pointerdown",jump);updateHUD();draw();mainMenu();
</script></body></html>

<script>
(function(){
  var mobileStyle=document.createElement("style");
  mobileStyle.textContent="#mobileJump{display:none;position:absolute;right:16px;bottom:16px;z-index:1;width:82px;height:82px;border:2px solid #ffffffaa;border-radius:50%;background:#ffd85bee;color:#292333;font-weight:bold;font-size:24px;place-content:center;text-align:center;box-shadow:0 5px 0 #a77924;touch-action:none;user-select:none;-webkit-user-select:none}.frame{touch-action:none}.hud{z-index:2}.layer{z-index:3}@media(max-width:700px){#mobileJump{display:grid}}#mobileJump small{display:block;font-size:11px;letter-spacing:.06em}";
  document.head.appendChild(mobileStyle);
  var button=document.createElement("button");
  button.id="mobileJump";button.type="button";button.setAttribute("aria-label","Pular");
  button.innerHTML="⬆<small>PULAR</small>";
  document.querySelector(".frame").appendChild(button);
  button.addEventListener("pointerdown",function(event){event.preventDefault();if(typeof jump==="function")jump();},{passive:false});
  var canvas=document.getElementById("game");
  canvas.addEventListener("pointerdown",function(event){event.preventDefault();},{passive:false});
})();
</script>
