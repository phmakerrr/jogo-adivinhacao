<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de adivinhação</title>
</head>
<body>
  <h1>Adivinhe o número</h1>
  <p>Escolhi um número de 1 a 10. Qual é o seu palpite?</p>

  <input id="palpite" type="number" min="1" max="10">
  <button onclick="verificar()">Tentar</button>
  <p id="mensagem"></p>

  <script>
    const segredo = Math.floor(Math.random() * 10) + 1;

    function verificar() {
      const palpite = Number(document.getElementById("palpite").value);
      const mensagem = document.getElementById("mensagem");

      if (palpite === segredo) {
        mensagem.textContent = "Acertou! Atualize a página para jogar de novo.";
      } else if (palpite < segredo) {
        mensagem.textContent = "Tente um número maior.";
      } else {
        mensagem.textContent = "Tente um número menor.";
      }
    }
  </script>
</body>
</html>
